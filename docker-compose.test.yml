services:
  app:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: magnusdtd/aic-hcmus-2025-backend
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-session:
        condition: service_healthy
    networks:
      - app_network
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydatabase
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_URL: http://minio:9000
      BASE_URL: https://localhost:443
      GOOGLE_CLIENT_ID: 271031008095-r37b0hc2aqkgq90nhurnl95v0as3b6ka.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      SECRET_KEY: this_is_a_secret_key
      REDIS_URL: redis://redis:6379/0
      REDIS_SESSION_URL: redis://redis-session:6380/0

  frontend:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: magnusdtd/aic-hcmus-2025-frontend
    ports:
      - "8070:8070"
    networks:
      - app_network
    depends_on:
      - app

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user -d mydatabase" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public 
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://minio:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-ssl:/etc/nginx/ssl:ro
    ports:
      - "443:443"
    depends_on:
      - app
      - frontend
      - minio
    networks:
      - app_network

  celery:
    build:
      context: .
      dockerfile: ./backend/app/predict/Dockerfile
    image: magnusdtd/aic-hcmus-2025-celery
    depends_on:
      - app
      - redis
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "celery", "-A", "app.predict.tasks.celery_app", "status"]
      interval: 10s
      timeout: 5s
      retries: 3
    environment:
      IS_CELERY_WORKER: true
      REDIS_URL: redis://redis:6379/0
      
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  redis-session:
    image: redis:alpine
    ports:
      - "6380:6380"
    command: ["redis-server", "--port", "6380"]
    volumes:
      - redis_session_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app_network

  backend-test:
    build:
      context: .
      dockerfile: tests/backend/Dockerfile.test
    command: ["pytest", "tests/backend"]
    depends_on:
      - db
      - minio
      - redis
      - redis-session
    environment:
      DATABASE_URL: postgresql://user:password@db:5432/mydatabase
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_URL: http://minio:9000
      BASE_URL: https://localhost:443
      GOOGLE_CLIENT_ID: 271031008095-r37b0hc2aqkgq90nhurnl95v0as3b6ka.apps.googleusercontent.com
      GOOGLE_CLIENT_SECRET: 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
      SECRET_KEY: this_is_a_secret_key
      REDIS_URL: redis://redis:6379/0
      REDIS_SESSION_URL: redis://redis-session:6380/0
    networks:
      - app_network

volumes:
  postgres_data:
  minio_data:
  redis_session_data:

networks:
  app_network:
    driver: bridge
