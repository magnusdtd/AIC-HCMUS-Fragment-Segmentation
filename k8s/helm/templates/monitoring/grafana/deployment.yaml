{{- if and .Values.monitoring.enabled .Values.monitoring.grafana.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-grafana
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "aic-hcmus-fragment-segmentation.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aic-hcmus-fragment-segmentation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: grafana
  template:
    metadata:
      labels:
        {{- include "aic-hcmus-fragment-segmentation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: grafana
    spec:
      containers:
      - name: grafana
        image: {{ .Values.monitoring.grafana.image.repository }}:{{ .Values.monitoring.grafana.image.tag }}
        imagePullPolicy: {{ .Values.monitoring.grafana.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.monitoring.grafana.service.port }}
          name: http
        env:
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: {{ .Values.monitoring.grafana.adminPassword | quote }}
        - name: GF_INSTALL_PLUGINS
          value: "grafana-piechart-panel,grafana-worldmap-panel"
        volumeMounts:
        - name: grafana-dashboards
          mountPath: /var/lib/grafana/dashboards
        - name: provisioning-alerting
          mountPath: /etc/grafana/provisioning/alerting
        - name: provisioning-datasources
          mountPath: /etc/grafana/provisioning/datasources
        - name: provisioning-dashboards
          mountPath: /etc/grafana/provisioning/dashboards
        resources:
          {{- toYaml .Values.monitoring.grafana.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /api/health
            port: {{ .Values.monitoring.grafana.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: {{ .Values.monitoring.grafana.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: grafana-dashboards
        configMap:
          name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-grafana-dashboards
      - name: provisioning-alerting
        configMap:
          name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-grafana-provisioning-alerting
      - name: provisioning-datasources
        configMap:
          name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-grafana-provisioning-datasources
      - name: provisioning-dashboards
        configMap:
          name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-grafana-provisioning-dashboards
{{- end }} 