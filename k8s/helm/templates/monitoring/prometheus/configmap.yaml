{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-prometheus-config
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "aic-hcmus-fragment-segmentation.labels" . | nindent 4 }}
    app.kubernetes.io/component: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: {{ .Values.monitoring.prometheus.scrapeInterval }}

    scrape_configs:
      - job_name: 'fastapi'
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-backend:{{ .Values.backend.service.port }}']

      - job_name: 'node_exporter'
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-node-exporter:{{ .Values.monitoring.exporters.nodeExporter.service.port }}']
          
      - job_name: 'postgres-exporter'
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-postgres-exporter:{{ .Values.monitoring.exporters.postgresExporter.service.port }}']

      - job_name: 'minio-job-cluster'
        metrics_path: /minio/v2/metrics/cluster
        scheme: http
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-minio:{{ .Values.minio.service.apiPort }}']

      - job_name: 'minio-job-bucket'
        metrics_path: /minio/v2/metrics/bucket
        scheme: http
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-minio:{{ .Values.minio.service.apiPort }}']

      - job_name: 'minio-job-node'
        metrics_path: /minio/v2/metrics/node
        scheme: http
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-minio:{{ .Values.minio.service.apiPort }}']

      - job_name: 'minio-job-resource'
        metrics_path: /minio/v2/metrics/resource
        scheme: http
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-minio:{{ .Values.minio.service.apiPort }}']

      - job_name: 'celery'
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-celery-exporter:{{ .Values.monitoring.exporters.celeryExporter.service.port }}']

      - job_name: 'redis-exporter'
        static_configs:
          - targets: ['{{ include "aic-hcmus-fragment-segmentation.name" . }}-redis-exporter:{{ .Values.monitoring.exporters.redisExporter.service.port }}']
{{- end }} 