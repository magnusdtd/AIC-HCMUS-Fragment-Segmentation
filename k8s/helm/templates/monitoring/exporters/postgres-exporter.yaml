{{- if and .Values.monitoring.enabled .Values.monitoring.exporters.postgresExporter.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-postgres-exporter
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "aic-hcmus-fragment-segmentation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aic-hcmus-fragment-segmentation.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres-exporter
  template:
    metadata:
      labels:
        {{- include "aic-hcmus-fragment-segmentation.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres-exporter
    spec:
      containers:
      - name: postgres-exporter
        image: {{ .Values.monitoring.exporters.postgresExporter.image.repository }}:{{ .Values.monitoring.exporters.postgresExporter.image.tag }}
        imagePullPolicy: {{ .Values.monitoring.exporters.postgresExporter.image.pullPolicy }}
        ports:
        - containerPort: {{ .Values.monitoring.exporters.postgresExporter.service.port }}
          name: metrics
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://{{ .Values.secrets.dbUser }}:{{ .Values.secrets.dbPassword }}@{{ include "aic-hcmus-fragment-segmentation.name" . }}-database:{{ .Values.database.service.port }}/{{ .Values.database.auth.database }}?sslmode=disable"
        resources:
          {{- toYaml .Values.monitoring.exporters.postgresExporter.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /metrics
            port: {{ .Values.monitoring.exporters.postgresExporter.service.port }}
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /metrics
            port: {{ .Values.monitoring.exporters.postgresExporter.service.port }}
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-postgres-exporter
  namespace: {{ .Values.monitoring.namespace }}
  labels:
    {{- include "aic-hcmus-fragment-segmentation.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
spec:
  type: {{ .Values.monitoring.exporters.postgresExporter.service.type }}
  ports:
  - port: {{ .Values.monitoring.exporters.postgresExporter.service.port }}
    targetPort: {{ .Values.monitoring.exporters.postgresExporter.service.port }}
    protocol: TCP
    name: metrics
  selector:
    {{- include "aic-hcmus-fragment-segmentation.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-exporter
{{- end }} 