{{- if .Values.nginx.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aic-hcmus-fragment-segmentation.name" . }}-nginx
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "aic-hcmus-fragment-segmentation.labels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
spec:
  type: {{ .Values.nginx.service.type }}
  ports:
  - name: https
    port: {{ .Values.nginx.service.httpsPort }}
    targetPort: 443
    protocol: TCP
  - name: http
    port: {{ .Values.nginx.service.httpPort }}
    targetPort: 80
    protocol: TCP
  selector:
    {{- include "aic-hcmus-fragment-segmentation.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: nginx
{{- end }} 